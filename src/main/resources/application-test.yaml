spring:
  application:
    name: warehouse-crossdock-service

  datasource:
    username: ${POSTGRES_USER:test}
    password: ${POSTGRES_PASSWORD:test}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      timeout: 1000ms

  flyway:
    enabled: true
    locations: classpath:db/migration/V1__init_crossdock_schema.sql
    clean-disabled: false

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  threads:
    virtual:
      enabled: true

logging:
  level:
    org.flywaydb: INFO